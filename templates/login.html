<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poway midland railrod manager system Login</title>
    <style>
        :root {
            --rust: #2A1A0E;
            --gold: #D4A017;
            --green: #2d6a4f;
            --red: #c0392b;
            --steel: #5a6872;
            --smoke: #666666;
            --track: #f5f5f5;
            --card: #ffffff;
            --border: #cccccc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #2A1A0E 0%, #4a3724 100%);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-card {
            background: var(--card);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid var(--gold);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 32px;
            color: var(--gold);
            letter-spacing: 2px;
        }

        .logo p {
            font-size: 12px;
            color: var(--smoke);
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 12px;
            color: var(--rust);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212,160,23,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: #b8860b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212,160,23,0.3);
        }

        .btn-login:disabled {
            background: var(--smoke);
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .error-message {
            background: rgba(192,57,43,0.1);
            border: 1px solid var(--red);
            color: var(--red);
        }

        .success-message {
            background: rgba(45,106,79,0.1);
            border: 1px solid var(--green);
            color: var(--green);
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="logo">
            <h1>🚂 Poway midland railrod manager system</h1>
            <p>Poway-Midland Railroad · Management System</p>
        </div>

        <div id="infoMsg" class="message" style="display: none;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>📧 UID / Username</label>
                <input type="text" id="uid" name="uid" required autocomplete="username" placeholder="Enter your UID">
            </div>
            <div class="form-group">
                <label>🔒 Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>
        
        <div style="margin-top: 20px; text-align: center; font-size: 11px; color: var(--smoke);">
            <p>Need help? Contact your administrator.</p>
    </div>
</div>

<script>
const BACKEND = (() => {
    const hostname = window.location.hostname;
    if (hostname === 'localhost' || hostname === '127.0.0.1') {
        return 'http://127.0.0.1:8428';
    }
    return 'https://rcr-user.opencodingsociety.com';
})();

function showMessage(message, type) {
    const msgDiv = document.getElementById('infoMsg');
    msgDiv.textContent = message;
    msgDiv.className = 'message ' + (type === 'success' ? 'success-message' : 'error-message');
    msgDiv.style.display = 'block';
    
    // 3秒后自动隐藏成功消息
    if (type === 'success') {
        setTimeout(() => {
            msgDiv.style.display = 'none';
        }, 3000);
    }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const uid = document.getElementById('uid').value.trim();
    const password = document.getElementById('password').value;
    const loginBtn = document.getElementById('loginBtn');
    const msgDiv = document.getElementById('infoMsg');
    
    // 隐藏之前的消息
    msgDiv.style.display = 'none';
    
    // 显示加载状态
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="loading-spinner"></span> Signing in...';
    
    try {
        console.log('Attempting login for:', uid);
        
        const response = await fetch(`${BACKEND}/api/authenticate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ uid, password })
        });
        
        const data = await response.json();
        console.log('Response:', response.status, data);
        
        if (response.ok) {
            // 登录成功
            showMessage('✅ Login successful! Redirecting...', 'success');
            loginBtn.innerHTML = '✓ Success!';
            
            // 延迟1秒后跳转
            setTimeout(() => {
                window.location.href = '/admin/user';
            }, 1000);
        } else {
            // 登录失败
            let errorMsg = data.message || 'Invalid UID or password';
            if (response.status === 401) {
                errorMsg = '❌ Invalid UID or password. Please try again.';
            } else if (response.status === 404) {
                errorMsg = '❌ Server error. Please contact administrator.';
            }
            showMessage(errorMsg, 'error');
            loginBtn.disabled = false;
            loginBtn.innerHTML = 'Sign In';
        }
    } catch (error) {
        console.error('Login error:', error);
        showMessage('❌ Network error. Cannot connect to server. Make sure the backend is running.', 'error');
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Sign In';
    }
});
</script>
</body>
</html>
